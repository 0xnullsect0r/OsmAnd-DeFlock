buildscript {
    ext.kotlin_version = '2.1.20'
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://developer.huawei.com/repo/'
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath("com.squareup.sqldelight:gradle-plugin:1.5.5")
        if (gradle.startParameter.taskNames.toString().toLowerCase().contains("huawei")) {
            classpath 'com.huawei.agconnect:agcp:1.9.1.303'
        }
    }
}

plugins {
	id "de.undercouch.download" version "4.1.1"
}

// OsmAnd's shared resources - routing profiles, POI types, rendering styles and icons - live
// in a separate repository (osmandapp/OsmAnd-resources). It is vendored here as the
// `resources` submodule so a fresh clone needs no manual setup:
//
//     git clone --recurse-submodules <this repo>
//     git submodule update --init --depth 1      # if you cloned without --recurse-submodules
//
// Upstream documents a sibling checkout instead, so that layout is still honoured and existing
// OsmAnd working copies keep building unchanged.
ext.osmandResourcesDir = {
	String marker = "poi/poi_types.xml"
	List<File> candidates = [file("$rootDir/resources"), file("$rootDir/../resources")]
	File found = candidates.find { new File(it, marker).exists() }
	if (found == null) {
		throw new GradleException("OsmAnd resources not found in " + candidates.join(" or ") +
				".\nRun: git submodule update --init --depth 1")
	}
	return found
}()


allprojects {
    group "net.osmand"
    // Configure all test tasks
    tasks.withType(Test).configureEach {
        // Set a system property for all unit tests
        systemProperty 'isAndroidBuild', 'true'
    }
    repositories {
        ivy {
            name = "OsmAndBinariesIvy"
            url = "https://builder.osmand.net"
            patternLayout {
                artifact "ivy/[organisation]/[module]/[revision]/[artifact]-[revision].[ext]"
            }
        }
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
        }
        maven {
            url 'https://developer.huawei.com/repo/'
        }
    }
}
